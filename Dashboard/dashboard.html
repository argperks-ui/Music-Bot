<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclipse Viper Control Engine</title>
  <link rel="icon" type="image/png" href="/tab-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-purple: #7928ca;
      --accent-indigo: #5865f2;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --danger: #ff4757;
      --success: #2ed573;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Styling */
    .sidebar {
      width: 300px;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--card-border);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand img { height: 38px; width: auto; filter: drop-shadow(0 0 10px rgba(0,242,254,0.3)); }

    .nav-group { display: flex; flex-direction: column; gap: 8px; }
    .nav-label { font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(88, 101, 242, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 242, 254, 0.2);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
    }

    /* Server Picker */
    .guild-card {
      margin-top: auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .guild-select {
      width: 100%;
      background: #090c14;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Main Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 32px 40px;
      overflow-y: auto;
      gap: 28px;
    }

    /* Top Search & Actions */
    .search-bar-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .search-input {
      flex: 1;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 24px;
      color: #fff;
      font-size: 1.05rem;
      outline: none;
      transition: all 0.3s;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
      color: #fff;
      border: none;
      padding: 16px 28px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(121, 40, 202, 0.3);
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(121, 40, 202, 0.5); }
    .btn:active { transform: translateY(0); }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      box-shadow: none;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); box-shadow: none; }

    /* Results Grid overlay */
    .search-results-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
    }

    .search-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .search-item:hover { border-color: rgba(0,242,254,0.3); background: rgba(0,242,254,0.04); }

    .track-thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; }

    /* Grid layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 28px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Player Console */
    .now-playing-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 30px;
      background: rgba(7, 9, 14, 0.6);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      position: relative;
      overflow: hidden;
    }

    .now-playing-cover {
      width: 180px;
      height: 180px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      margin-bottom: 20px;
    }

    .track-name { font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .track-artist { font-size: 0.95rem; color: var(--accent-cyan); font-weight: 600; margin-bottom: 16px; }

    /* Control Deck */
    .deck-controls { display: flex; align-items: center; justify-content: center; gap: 16px; }

    .control-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .control-btn:hover { background: rgba(0, 242, 254, 0.2); border-color: var(--accent-cyan); transform: scale(1.08); }
    .control-btn.active-toggle { border-color: var(--accent-cyan); background: rgba(0, 242, 254, 0.25); box-shadow: 0 0 15px rgba(0,242,254,0.4); }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px 20px;
      border-radius: 12px;
    }

    .volume-slider { flex: 1; accent-color: var(--accent-cyan); cursor: pointer; }

    /* Queue System */
    .queue-header { display: flex; justify-content: space-between; align-items: center; }
    .queue-list { display: flex; flex-direction: column; gap: 12px; list-style: none; max-height: 480px; overflow-y: auto; }
    
    .queue-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(7, 9, 14, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      transition: 0.2s;
    }

    .queue-card:hover { border-color: rgba(255, 255, 255, 0.2); }

    .remove-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-weight: 700;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
    }

    .remove-btn:hover { background: rgba(255, 71, 87, 0.15); }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <img src="/tab-icon.png" alt="Logo" onerror="this.style.display='none'">
      <span>Eclipse Viper</span>
    </div>

    <div class="nav-group">
      <span class="nav-label">Core Engine</span>
      <div class="nav-item active">🎵 Live Studio Controller</div>
      <div class="nav-item">⚙️ Guild Audio Rules</div>
      <div class="nav-item">📊 Engine Performance</div>
    </div>

    <div class="guild-card">
      <span class="nav-label">Target Server</span>
      <select id="guildSelect" class="guild-select" onchange="switchGuild()">
        <option value="123456789012345678">Default Guild (123456789012345678)</option>
      </select>
    </div>
  </aside>

  <main class="workspace">
    
    <!-- Instant Track Search Engine -->
    <div class="search-bar-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="Search tracks, artists, or paste stream links..." onkeydown="handleSearchKey(event)">
      <button class="btn" onclick="triggerSearch()">Search Catalog</button>
    </div>

    <div id="searchPanel" class="search-results-panel">
      <span class="nav-label">Search Results</span>
      <div id="searchResultsList" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>

    <div class="dashboard-grid">
      
      <!-- Player Console -->
      <div class="card">
        <span class="nav-label">Master Player</span>
        
        <div class="now-playing-stage">
          <img id="coverArt" src="https://picsum.photos/seed/default/300/300" class="now-playing-cover" alt="Cover Art">
          <div id="displayTitle" class="track-name">No Active Playback</div>
          <div id="displayArtist" class="track-artist">Select a track or search above</div>
        </div>

        <div class="deck-controls">
          <button class="control-btn" id="btnShuffle" onclick="sendControl('toggle_shuffle')">🔀</button>
          <button class="control-btn" onclick="sendControl('pause')">⏸️</button>
          <button class="control-btn" style="width: 64px; height: 64px; background: var(--accent-cyan); color: #000;" onclick="sendControl('resume')">▶️</button>
          <button class="control-btn" onclick="sendControl('skip')">⏭️</button>
          <button class="control-btn" id="btnRepeat" onclick="sendControl('toggle_repeat')">🔁</button>
        </div>

        <div class="volume-box">
          <span style="font-size: 0.9rem;">🔊 Volume</span>
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="80" onchange="adjustVolume(this.value)">
          <span id="volumeVal" style="font-size: 0.85rem; width: 32px;">80%</span>
        </div>
      </div>

      <!-- Queue Deck -->
      <div class="card">
        <div class="queue-header">
          <span class="nav-label">Up Next in Queue</span>
          <button class="btn btn-secondary" style="padding: 6px 14px; font-size: 0.8rem;" onclick="sendControl('clear')">Clear All</button>
        </div>

        <ul class="queue-list" id="queueList">
          <li style="color: var(--text-muted); text-align: center; padding: 20px;">Queue is empty</li>
        </ul>
      </div>

    </div>

  </main>

  <script>
    let currentGuildId = "123456789012345678";

    async function initGuilds() {
      try {
        const res = await fetch('/api/bot/guilds');
        const data = await res.json();
        const select = document.getElementById('guildSelect');
        if (data.guilds && data.guilds.length > 0) {
          select.innerHTML = data.guilds.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
          currentGuildId = data.guilds[0].id;
        }
      } catch (e) {
        console.warn("Using default target guild identifier");
      }
      pollState();
    }

    function switchGuild() {
      currentGuildId = document.getElementById('guildSelect').value;
      pollState();
    }

    function handleSearchKey(e) {
      if (e.key === 'Enter') triggerSearch();
    }

    async function triggerSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;

      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();

      const panel = document.getElementById('searchPanel');
      const container = document.getElementById('searchResultsList');

      if (data.results && data.results.length > 0) {
        panel.style.display = 'flex';
        container.innerHTML = data.results.map(item => `
          <div class="search-item">
            <div style="display:flex; align-items:center; gap:12px;">
              <img src="${item.thumbnail}" class="track-thumb" alt="Thumb">
              <div>
                <div style="font-weight:700; color:#fff;">${item.title}</div>
                <div style="font-size:0.8rem; color:var(--text-muted);">${item.artist} • ${item.duration}</div>
              </div>
            </div>
            <button class="btn" style="padding:8px 16px; font-size:0.85rem;" onclick="addTrack('${item.query}')">Play Track</button>
          </div>
        `).join('');
      }
    }

    async function addTrack(queryStr) {
      await fetch('/api/player/play', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guild_id: parseInt(currentGuildId) || 0, query: queryStr, added_by: 'Dashboard' })
      });
      document.getElementById('searchPanel').style.display = 'none';
      document.getElementById('searchInput').value = '';
      pollState();
    }

    async function sendControl(actionName) {
      await fetch('/api/player/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guild_id: parseInt(currentGuildId) || 0, action: actionName })
      });
      pollState();
    }

    async function adjustVolume(val) {
      document.getElementById('volumeVal').innerText = val + '%';
      await fetch('/api/player/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guild_id: parseInt(currentGuildId) || 0, action: 'volume', value: parseInt(val) })
      });
    }

    async function removeQueueIndex(idx) {
      await fetch('/api/player/remove', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guild_id: parseInt(currentGuildId) || 0, index: idx })
      });
      pollState();
    }

    async function pollState() {
      const targetId = parseInt(currentGuildId) || 0;
      const res = await fetch(`/api/player/state/${targetId}`);
      const data = await res.json();
      const st = data.state;

      if (!st) return;

      if (st.current) {
        document.getElementById('displayTitle').innerText = st.current.title;
        document.getElementById('displayArtist').innerText = st.current.artist + ` (Requested by ${st.current.added_by})`;
        document.getElementById('coverArt').src = st.current.thumbnail;
      } else {
        document.getElementById('displayTitle').innerText = 'No Active Playback';
        document.getElementById('displayArtist').innerText = 'Select a track or search above';
      }

      document.getElementById('btnShuffle').classList.toggle('active-toggle', st.shuffle);
      document.getElementById('btnRepeat').classList.toggle('active-toggle', st.repeat);
      document.getElementById('volumeSlider').value = st.volume;
      document.getElementById('volumeVal').innerText = st.volume + '%';

      const queueList = document.getElementById('queueList');
      if (st.queue && st.queue.length > 0) {
        queueList.innerHTML = st.queue.map((item, idx) => `
          <li class="queue-card">
            <div style="display:flex; align-items:center; gap:12px;">
              <span style="font-weight:700; color:var(--accent-cyan);">#${idx + 1}</span>
              <div>
                <div style="font-weight:700; color:#fff; font-size:0.9rem;">${item.title}</div>
                <div style="font-size:0.75rem; color:var(--text-muted);">${item.added_by}</div>
              </div>
            </div>
            <button class="remove-btn" onclick="removeQueueIndex(${idx})">✕</button>
          </li>
        `).join('');
      } else {
        queueList.innerHTML = `<li style="color: var(--text-muted); text-align: center; padding: 20px;">Queue is empty</li>`;
      }
    }

    initGuilds();
    setInterval(pollState, 2500);
  </script>
</body>
</html>
